<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熠达通 - 智能招标工作流系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .launcher {
            text-align: center;
            color: white;
        }
        .logo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(233, 69, 96, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .logo-container svg {
            width: 100px;
            height: 100px;
        }
        .app-name {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #e94560 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-slogan {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 4px;
            margin-bottom: 50px;
        }
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #e94560;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="launcher">
        <div class="logo-container">
            <svg viewBox="0 0 100 100">
                <path d="M25 75 L50 40 L75 75" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="50" cy="40" r="6" fill="white"/>
            </svg>
        </div>
        <div class="app-name">熠达通</div>
        <div class="app-slogan">智能招标工作流系统</div>
        <div class="loading">
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span>正在启动...</span>
        </div>
    </div>
    <script>
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1500);
    </script>
</body>
</html>
