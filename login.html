<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熠达通 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(135deg,#0d1117,#1a1a2e);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box{
  background:#161b22;
  border:1px solid rgba(233,69,96,.2);
  border-radius:20px;
  padding:48px 40px;
  width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.logo{
  text-align:center;
  margin-bottom:32px;
}
.logo-icon{
  width:60px;
  height:60px;
  background:linear-gradient(135deg,#e94560,#ff6b6b);
  border-radius:16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
  box-shadow:0 8px 20px rgba(233,69,96,.4);
}
.logo-icon svg{width:32px;height:32px}
.logo-text{font-size:1.5rem;font-weight:800;color:#fff;letter-spacing:2px}
.logo-text span{color:#e94560}
.subtitle{
  text-align:center;
  color:rgba(255,255,255,.4);
  font-size:.85rem;
  margin-bottom:32px;
}
.input-group{
  margin-bottom:20px;
}
.input-group label{
  display:block;
  color:rgba(255,255,255,.6);
  font-size:.85rem;
  margin-bottom:8px;
}
.input-group input{
  width:100%;
  padding:14px 16px;
  background:#0d1117;
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  color:#fff;
  font-size:1rem;
  transition:all .2s;
}
.input-group input:focus{
  outline:none;
  border-color:#e94560;
  box-shadow:0 0 0 3px rgba(233,69,96,.1);
}
.input-group input::placeholder{
  color:rgba(255,255,255,.3);
}
.btn{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,#e94560,#ff6b6b);
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  margin-top:8px;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(233,69,96,.4);
}
.btn:active{
  transform:translateY(0);
}
.tip{
  text-align:center;
  color:rgba(255,255,255,.4);
  font-size:.8rem;
  margin-top:24px;
  line-height:1.6;
}
.tip a{
  color:#e94560;
  text-decoration:none;
}
.error-msg{
  background:rgba(220,38,38,.1);
  border:1px solid rgba(220,38,38,.3);
  color:#ef4444;
  padding:12px;
  border-radius:8px;
  font-size:.85rem;
  margin-bottom:20px;
  display:none;
}
.features{
  margin-top:32px;
  padding-top:24px;
  border-top:1px solid rgba(255,255,255,.06);
}
.features p{
  color:rgba(255,255,255,.5);
  font-size:.8rem;
  margin-bottom:12px;
}
.features ul{
  list-style:none;
  color:rgba(255,255,255,.4);
  font-size:.75rem;
  line-height:1.8;
}
.features ul li::before{
  content:"✓ ";
  color:#10b981;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 100 100" fill="none"><path d="M20 70 L50 30 L80 70" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="50" cy="30" r="8" fill="#fff"/></svg>
    </div>
    <div class="logo-text">熠达<span>通</span></div>
  </div>
  
  <div class="subtitle">招投标智能工作台</div>
  
  <div class="error-msg" id="errorMsg"></div>
  
  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="input-group">
      <label>手机号</label>
      <input type="text" id="phone" placeholder="请输入手机号" maxlength="11" required>
    </div>
    
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    
    <button type="submit" class="btn">登录</button>
  </form>
  
  <div class="tip">
    首次使用？请联系管理员开通账号<br>
    <a href="javascript:showContact()">获取试用账号</a>
  </div>
  
  <div class="features">
    <p>熠达通能帮你：</p>
    <ul>
      <li>每日自动抓取招标信息</li>
      <li>AI智能分析招标要求</li>
      <li>一键生成投标响应框架</li>
      <li>项目全流程管理</li>
    </ul>
  </div>
</div>

<script>
// 用户数据（手动维护，添加新用户在这里加）
const USERS = {
  "13800138000": { name: "测试用户", password: "123456", isPaid: false },
  "13900139000": { name: "付费用户", password: "123456", isPaid: true }
};

function handleLogin(e) {
  e.preventDefault();
  
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  
  if (!/^1[3-9]\d{9}$/.test(phone)) {
    showError('请输入正确的手机号');
    return false;
  }
  
  const user = USERS[phone];
  if (!user) {
    showError('账号不存在，请联系管理员开通');
    return false;
  }
  
  if (user.password !== password) {
    showError('密码错误');
    return false;
  }
  
  const userData = {
    phone: phone,
    name: user.name,
    isPaid: user.isPaid,
    loginTime: new Date().toISOString()
  };
  localStorage.setItem('yidatong_user', JSON.stringify(userData));
  
  window.location.href = 'index.html';
  
  return false;
}

function showError(msg) {
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  setTimeout(() => {
    errorMsg.style.display = 'none';
  }, 3000);
}

function showContact() {
  alert('获取试用账号请联系管理员：\n\n微信：funfun0\n\n发送"熠达通试用"即可免费获取账号');
}

// 检查是否已登录
const existingUser = localStorage.getItem('yidatong_user');
if (existingUser) {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
