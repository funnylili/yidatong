<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熠达通 LOGO - YD字母融合</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
        }
        .subtitle {
            color: #9ca3af;
            text-align: center;
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }
        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .logo-card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            transition: all 0.4s;
            cursor: pointer;
            position: relative;
        }
        .logo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 60px rgba(233,69,96,0.25);
        }
        .logo-card.selected {
            border: 3px solid #e94560;
        }
        .logo-card.selected::before {
            content: '✓ 推荐方案';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            padding: 0.4rem 1.25rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .logo-preview {
            width: 160px;
            height: 160px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 32px;
        }
        .logo-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }
        .logo-desc {
            font-size: 0.95rem;
            color: #6b7280;
            line-height: 1.6;
        }
        .preview-sizes {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f3f4f6;
        }
        .size-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        .size-label {
            font-size: 0.75rem;
            color: #9ca3af;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 3rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 1rem 2.5rem;
            border-radius: 14px;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
            border: none;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(233,69,96,0.35);
        }
        .btn-secondary {
            background: white;
            color: #1a1a2e;
            border: 2px solid rgba(0,0,0,0.1);
        }
        .btn-secondary:hover {
            border-color: #e94560;
            color: #e94560;
        }
        .section-title {
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            margin: 2.5rem 0 1.5rem;
            text-align: center;
        }
        .section-title span {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 熠达通 LOGO设计</h1>
        <p class="subtitle">YD字母融合方案 | 简洁·专业·独特</p>

        <div class="section-title"><span>🔥 推荐方案</span></div>
        <div class="logo-grid">
            <!-- 方案1：YD展台融合 -->
            <div class="logo-card selected" onclick="selectLogo(1, this)">
                <div class="logo-preview" style="background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);">
                    <svg width="110" height="110" viewBox="0 0 100 100">
                        <!-- Y字母形成左立柱 -->
                        <path d="M15 80 L35 45 L35 80" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M35 45 L55 45" stroke="white" stroke-width="12" stroke-linecap="round"/>
                        <!-- D字母形成右半部分 -->
                        <path d="M55 20 L55 80" stroke="white" stroke-width="12" stroke-linecap="round"/>
                        <path d="M55 20 Q 90 50, 55 80" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>
                        <!-- 横梁连接 -->
                        <rect x="35" y="42" width="20" height="6" fill="white"/>
                    </svg>
                </div>
                <div class="logo-name">方案一：YD展台融合</div>
                <div class="logo-desc">Y字母形成左立柱，D字母形成右侧弧形<br>两者通过横梁连接，象征稳固合作</div>
                <div class="preview-sizes">
                    <div class="size-item">
                        <div style="width:48px;height:48px;background:linear-gradient(135deg,#e94560,#c73e54);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                            <svg width="32" height="32" viewBox="0 0 100 100">
                                <path d="M15 80 L35 45 L35 80" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>
                                <path d="M35 45 L55 45" stroke="white" stroke-width="12"/>
                                <path d="M55 20 L55 80" stroke="white" stroke-width="12"/>
                                <path d="M55 20 Q 90 50, 55 80" stroke="white" stroke-width="12" fill="none"/>
                            </svg>
                        </div>
                        <span class="size-label">48px</span>
                    </div>
                    <div class="size-item">
                        <div style="width:32px;height:32px;background:linear-gradient(135deg,#e94560,#c73e54);border-radius:8px;display:flex;align-items:center;justify-content:center;">
                            <svg width="20" height="20" viewBox="0 0 100 100">
                                <path d="M15 80 L35 45 L35 80" stroke="white" stroke-width="14" fill="none" stroke-linecap="round"/>
                                <path d="M55 20 L55 80" stroke="white" stroke-width="14"/>
                                <path d="M55 20 Q 90 50, 55 80" stroke="white" stroke-width="14" fill="none"/>
                            </svg>
                        </div>
                        <span class="size-label">32px</span>
                    </div>
                    <div class="size-item">
                        <div style="width:16px;height:16px;background:linear-gradient(135deg,#e94560,#c73e54);border-radius:4px;display:flex;align-items:center;justify-content:center;">
                            <svg width="10" height="10" viewBox="0 0 100 100">
                                <path d="M15 80 L35 45 L35 80" stroke="white" stroke-width="16" fill="none" stroke-linecap="round"/>
                                <path d="M55 20 L55 80" stroke="white" stroke-width="16"/>
                            </svg>
                        </div>
                        <span class="size-label">16px</span>
                    </div>
                </div>
            </div>

            <!-- 方案2：YD抽象融合 -->
            <div class="logo-card" onclick="selectLogo(2, this)">
                <div class="logo-preview" style="background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);">
                    <svg width="110" height="110" viewBox="0 0 100 100">
                        <!-- Y的上方两笔变成D的上下 -->
                        <path d="M25 25 L50 50" stroke="#e94560" stroke-width="10" fill="none" stroke-linecap="round"/>
                        <path d="M75 25 L50 50" stroke="#e94560" stroke-width="10" fill="none" stroke-linecap="round"/>
                        <!-- D的弧线 -->
                        <path d="M50 50 L50 85 Q 85 70, 50 50" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Y的下方延伸 -->
                        <path d="M50 50 L50 75" stroke="#e94560" stroke-width="10" stroke-linecap="round"/>
                        <!-- 底部横线 -->
                        <path d="M25 85 L75 85" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
                    </svg>
                </div>
                <div class="logo-name">方案二：抽象融合</div>
                <div class="logo-desc">Y的上方形成展开之势<br>D的弧线包裹下方，现代感强</div>
            </div>

            <!-- 方案3：YD圆形融合 -->
            <div class="logo-card" onclick="selectLogo(3, this)">
                <div class="logo-preview" style="background: linear-gradient(135deg, #d4a574 0%, #b8956a 100%);">
                    <svg width="110" height="110" viewBox="0 0 100 100">
                        <!-- 外圆 -->
                        <circle cx="50" cy="50" r="42" fill="none" stroke="white" stroke-width="4"/>
                        <!-- YD融合 -->
                        <path d="M30 70 L50 35 L70 70" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M50 35 L50 55" stroke="white" stroke-width="8" stroke-linecap="round"/>
                        <!-- D的弧线融入圆 -->
                        <path d="M50 55 Q 75 55, 75 70 Q 75 85, 50 85 L30 70" stroke="white" stroke-width="6" fill="none"/>
                        <!-- 顶部光点 -->
                        <circle cx="50" cy="20" r="5" fill="white"/>
                    </svg>
                </div>
                <div class="logo-name">方案三：圆形融合</div>
                <div class="logo-desc">圆形外框，内部YD融合<br>金色高端，适合正式场合</div>
            </div>
        </div>

        <div class="section-title"><span>💡 备选方案</span></div>
        <div class="logo-grid">
            <!-- 方案4：YD几何 -->
            <div class="logo-card" onclick="selectLogo(4, this)">
                <div class="logo-preview" style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);">
                    <svg width="110" height="110" viewBox="0 0 100 100">
                        <!-- Y的几何化 -->
                        <polygon points="30,75 50,40 70,75" fill="white"/>
                        <rect x="45" y="40" width="10" height="35" fill="white"/>
                        <!-- D的几何化 -->
                        <path d="M50 25 L50 75 Q 80 50, 50 25" fill="white" opacity="0.7"/>
                    </svg>
                </div>
                <div class="logo-name">方案四：几何YD</div>
                <div class="logo-desc">几何化处理，现代简约<br>蓝色科技感，适合数字化场景</div>
            </div>

            <!-- 方案5：YD线条 -->
            <div class="logo-card" onclick="selectLogo(5, this)">
                <div class="logo-preview" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                    <svg width="110" height="110" viewBox="0 0 100 100">
                        <!-- Y线条 -->
                        <path d="M20 75 L50 35" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
                        <path d="M50 35 L50 75" stroke="white" stroke-width="8" stroke-linecap="round"/>
                        <!-- D线条 -->
                        <path d="M50 35 L80 35" stroke="white" stroke-width="8" stroke-linecap="round"/>
                        <path d="M80 35 Q 95 55, 80 75 L50 75" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="logo-name">方案五：线条YD</div>
                <div class="logo-desc">流畅线条，动感十足<br>绿色代表成长与希望</div>
            </div>

            <!-- 方案6：YD立体 -->
            <div class="logo-card" onclick="selectLogo(6, this)">
                <div class="logo-preview" style="background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);">
                    <svg width="110" height="110" viewBox="0 0 100 100">
                        <!-- 3D Y -->
                        <polygon points="20,80 40,45 40,80" fill="white"/>
                        <polygon points="40,45 60,45 40,80" fill="white" opacity="0.7"/>
                        <!-- 3D D -->
                        <rect x="60" y="25" width="8" height="55" fill="white"/>
                        <path d="M60 25 Q 90 50, 60 80" stroke="white" stroke-width="8" fill="none"/>
                        <!-- 阴影 -->
                        <polygon points="40,45 60,45 40,80" fill="#d4a574" opacity="0.3"/>
                    </svg>
                </div>
                <div class="logo-name">方案六：立体YD</div>
                <div class="logo-desc">3D立体效果，高端大气<br>紫色神秘，独特个性</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="applyLogo()">✅ 应用此LOGO</button>
            <button class="btn btn-secondary" onclick="alert('SVG导出功能开发中...')">📥 下载SVG</button>
        </div>
    </div>

    <script>
        let selectedLogo = 1;

        function selectLogo(num, el) {
            selectedLogo = num;
            document.querySelectorAll('.logo-card').forEach(card => {
                card.classList.remove('selected');
            });
            el.classList.add('selected');
        }

        function applyLogo() {
            const logos = {
                1: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" rx="20" fill="url(#grad)"/>
                    <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#e94560"/>
                        <stop offset="100%" style="stop-color:#c73e54"/>
                    </linearGradient></defs>
                    <path d="M15 80 L35 45 L35 80" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M35 45 L55 45" stroke="white" stroke-width="12" stroke-linecap="round"/>
                    <path d="M55 20 L55 80" stroke="white" stroke-width="12" stroke-linecap="round"/>
                    <path d="M55 20 Q 90 50, 55 80" stroke="white" stroke-width="12" fill="none" stroke-linecap="round"/>
                </svg>`
            };
            
            alert('✅ YD融合LOGO已应用！\n\n方案' + selectedLogo + '将成为熠达通的新LOGO');
        }
    </script>
</body>
</html>
